<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Aniversário do Murilo – 4 anos</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#02030a;overflow:hidden;font-family:"Arial Black","Segoe UI",system-ui,sans-serif}

  /* Palco 9:16 centralizado, as imagens ocupam o máximo possível da tela */
  .stage{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    height:min(100dvh, calc(100vw * 16 / 9));
    aspect-ratio:9/16;
    background:#000;overflow:hidden;container-type:inline-size;
  }
  .page{position:absolute;inset:0;display:none}
  .page.active{display:block;animation:fadeIn .45s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .page > img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}

  /* Tela 1 */
  #inicio{cursor:pointer}

  /* Vídeo */
  #video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

  /* Áreas clicáveis sobre a imagem interativa (em % da imagem) */
  .hot{position:absolute;display:block;border-radius:9% / 14%;cursor:pointer;outline:none;transition:transform .15s ease, box-shadow .2s ease}
  .hot:hover,.hot:focus-visible{transform:scale(1.04);box-shadow:0 0 22px 4px rgba(255,255,255,.55)}
  .hot:active{transform:scale(.97)}
  #h-confirmar{left:10.4%;top:60.2%;width:38.8%;height:13.6%}
  #h-local    {left:50.2%;top:60.2%;width:39.2%;height:13.6%}
  #h-presente {left:9.4%; top:74.0%;width:39.8%;height:14.6%}
  #h-manual   {left:50.2%;top:74.0%;width:39.8%;height:14.6%}

  /* Botão 3D vermelho + azul, texto branco */
  .btn3d{
    position:absolute;left:50%;bottom:3.2%;transform:translateX(-50%);
    z-index:20;border:0;cursor:pointer;white-space:nowrap;
    font-family:"Arial Black","Segoe UI",system-ui,sans-serif;font-weight:900;
    font-size:5.3cqw;letter-spacing:.03em;text-transform:uppercase;
    color:#fff;padding:.7em 1.5em;border-radius:999px;
    background:
      linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,0) 46%),
      linear-gradient(100deg,#ff1f3d 0%,#d00a24 46%,#1d4dff 54%,#0a2bb8 100%);
    text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 10px rgba(0,0,0,.35);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.65),
      inset 0 -4px 6px rgba(0,0,0,.35),
      0 0 0 3px #fff,
      0 6px 0 3px #12185c,
      0 12px 0 3px #6b0715,
      0 18px 22px rgba(0,0,0,.7);
    transition:transform .12s ease, box-shadow .12s ease, filter .2s;
    animation:float 2.2s ease-in-out infinite;
  }
  .btn3d:hover{filter:brightness(1.12)}
  .btn3d:active{
    animation:none;transform:translateX(-50%) translateY(8px);
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,.5),
      inset 0 -3px 5px rgba(0,0,0,.35),
      0 0 0 3px #fff,
      0 2px 0 3px #12185c,
      0 4px 0 3px #6b0715,
      0 6px 10px rgba(0,0,0,.7);
  }
  @keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-5px)}}

  /* Camada do efeito aranha/teia (acima de tudo, não bloqueia cliques) */
  #fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}
</style>
</head>
<body>

<div class="stage">
  <!-- 1. Primeira tela -->
  <section class="page active" id="inicio" aria-label="Envelope do convite">
    <img class="bg" src="primeira.jpg" alt="Clique no envelope para abrir">
  </section>

  <!-- 2. Vídeo -->
  <section class="page" id="video" aria-label="Introdução">
    <video id="vid" src="video.mp4" playsinline webkit-playsinline preload="auto"></video>
    <button class="btn3d" id="pular" type="button">Pular introdução</button>
  </section>

  <!-- 3. Convite interativo -->
  <section class="page" id="interativo" aria-label="Convite">
    <img class="bg" src="interativo.jpg" alt="Convite de aniversário do Murilo, 4 anos">
    <a class="hot" id="h-confirmar" aria-label="Confirme sua presença"
       href="https://wa.me/5521989011118?text=%F0%9F%95%B7%F0%9F%95%B8Ol%C3%A1!%20Quero%20confirmar%20presen%C3%A7a%20no%20anivers%C3%A1rio%20do%20Murilo.%20%F0%9F%95%B8%F0%9F%95%B7%0A%0ASeremos%3A%0A%0A(___)%20ADULTOS%0A*Nomes%3A*%0A%0A(___)%20CRIAN%C3%87AS%0A*Nomes%20e%20idades%3A*"
       target="_blank" rel="noopener"></a>
    <a class="hot" id="h-local" aria-label="Veja a localização"
       href="https://share.google/W1G0pvTeP0nLST9Bz" target="_blank" rel="noopener"></a>
    <a class="hot" id="h-presente" aria-label="Sugestões de presente" href="#presentes" data-go="presentes"></a>
    <a class="hot" id="h-manual" aria-label="Manual do convidado" href="#manual" data-go="manual"></a>
  </section>

  <!-- 4. Sugestões de presente -->
  <section class="page" id="presentes" aria-label="Sugestões de presente">
    <img class="bg" src="presentes.jpg" alt="Sugestões de presente">
    <button class="btn3d" type="button" data-go="interativo">Voltar ao convite</button>
  </section>

  <!-- 5. Manual do convidado -->
  <section class="page" id="manual" aria-label="Manual do convidado">
    <img class="bg" src="manual.jpg" alt="Manual do convidado">
    <button class="btn3d" type="button" data-go="interativo">Voltar ao convite</button>
  </section>
</div>

<canvas id="fx"></canvas>

<script>
(function(){
  /* ---------- Navegação ---------- */
  var pages = {};
  document.querySelectorAll('.page').forEach(function(p){ pages[p.id] = p; });
  var vid = document.getElementById('vid');
  var current = 'inicio';

  function show(id, push){
    if(!pages[id]) id = 'inicio';
    if(current === 'video' && id !== 'video'){ try{ vid.pause(); }catch(e){} }
    Object.keys(pages).forEach(function(k){ pages[k].classList.toggle('active', k === id); });
    current = id;
    if(id === 'video'){
      try{ vid.currentTime = 0; }catch(e){}
      var p = vid.play();
      if(p && p.catch){
        p.catch(function(){            /* se o navegador bloquear o som, toca mudo */
          vid.muted = true;
          vid.play().catch(function(){});
        });
      }
    }
    if(push !== false){ try{ history.pushState({page:id}, '', '#' + id); }catch(e){} }
  }

  try{ history.replaceState({page:'inicio'}, '', location.pathname + location.search); }catch(e){}
  window.addEventListener('popstate', function(e){
    var id = (e.state && e.state.page) || 'inicio';
    if(id === 'video') id = 'inicio';
    show(id, false);
  });

  document.getElementById('inicio').addEventListener('click', function(){ show('video'); });
  document.getElementById('pular').addEventListener('click', function(){ show('interativo'); });
  vid.addEventListener('ended', function(){ if(current === 'video') show('interativo'); });
  document.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click', function(ev){ ev.preventDefault(); show(el.getAttribute('data-go')); });
  });

  /* Pré-carrega as imagens para a troca de tela ser instantânea */
  ['interativo.jpg','presentes.jpg','manual.jpg'].forEach(function(src){ var i = new Image(); i.src = src; });

  /* ---------- Efeito Homem-Aranha: aranhas + teia a cada clique ---------- */
  var cv = document.getElementById('fx'), ctx = cv.getContext('2d');
  var W=0, H=0, DPR=1, effects=[], running=false, last=0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W*DPR; cv.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize); resize();

  var rnd = function(a,b){ return a + Math.random()*(b-a); };
  var easeOut = function(t){ return 1 - Math.pow(1-t, 3); };

  function burst(x, y){
    var scale = Math.min(W, H) / 700; scale = Math.max(0.7, Math.min(scale, 1.4));
    var n = 9 + Math.floor(Math.random()*3);
    var R = rnd(120, 175) * scale;
    var spokes = [], base = rnd(0, Math.PI*2);
    for(var i=0;i<n;i++) spokes.push(base + i*(Math.PI*2/n) + rnd(-.07,.07));
    var spiders = [], count = 7 + Math.floor(Math.random()*3);
    for(var j=0;j<count;j++){
      spiders.push({
        ang: base + j*(Math.PI*2/count) + rnd(-.35,.35),
        max: rnd(110, 300) * scale,
        size: rnd(4.2, 7.2) * scale,
        phase: rnd(0, 6.28),
        k: rnd(2.2, 3.4)
      });
    }
    effects.push({x:x,y:y,age:0,R:R,spokes:spokes,spiders:spiders,rings:5,life:2.6});
    if(!running){ running = true; last = performance.now(); requestAnimationFrame(loop); }
  }

  function drawWeb(e){
    var reveal = Math.min(1, e.age/0.5), r = easeOut(reveal);
    var fade = e.age < 1.3 ? 1 : Math.max(0, 1 - (e.age-1.3)/(e.life-1.3));
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(160,200,255,.95)'; ctx.shadowBlur = 10;
    ctx.strokeStyle = 'rgba(255,255,255,.95)';

    /* pulso de choque vermelho/azul */
    var pr = easeOut(Math.min(1, e.age/0.55)) * e.R * 1.05;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,40,70,' + (0.65*(1-Math.min(1,e.age/0.55))) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, pr, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = 'rgba(70,120,255,' + (0.55*(1-Math.min(1,e.age/0.65))) + ')';
    ctx.beginPath(); ctx.arc(e.x, e.y, pr*0.78, 0, 6.2832); ctx.stroke();

    /* raios */
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.7;
    e.spokes.forEach(function(a){
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.lineTo(e.x + Math.cos(a)*e.R*r, e.y + Math.sin(a)*e.R*r); ctx.stroke();
    });
    /* anéis curvos entre os raios */
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(235,245,255,.85)';
    for(var k=1;k<=e.rings;k++){
      var rad = e.R * k / e.rings;
      if(rad > e.R*r) break;
      for(var i=0;i<e.spokes.length;i++){
        var a1 = e.spokes[i], a2 = e.spokes[(i+1)%e.spokes.length];
        if(a2 < a1) a2 += Math.PI*2;
        var mid = (a1+a2)/2, sag = rad*0.82;
        ctx.beginPath();
        ctx.moveTo(e.x + Math.cos(a1)*rad, e.y + Math.sin(a1)*rad);
        ctx.quadraticCurveTo(e.x + Math.cos(mid)*sag, e.y + Math.sin(mid)*sag,
                             e.x + Math.cos(a2)*rad, e.y + Math.sin(a2)*rad);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawSpider(e, s){
    var t = e.age;
    var dist = s.max * (1 - Math.exp(-t*s.k));
    var moving = Math.exp(-t*s.k) ;           /* 1 → 0 conforme desacelera */
    var px = e.x + Math.cos(s.ang)*dist, py = e.y + Math.sin(s.ang)*dist;
    var fade = t < 1.5 ? 1 : Math.max(0, 1 - (t-1.5)/(e.life-1.5));
    var appear = Math.min(1, t/0.12);

    ctx.save();
    ctx.globalAlpha = fade * appear;

    /* fio de seda ligando ao ponto do clique */
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(px, py); ctx.stroke();

    ctx.translate(px, py); ctx.rotate(s.ang);
    var z = s.size, wig = (0.25 + moving*0.9) * 0.45, ph = s.phase + t*(10 + moving*22);

    /* pernas */
    ctx.strokeStyle = '#0b0b12'; ctx.lineWidth = Math.max(1, z*0.22); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(255,255,255,.9)'; ctx.shadowBlur = 4;
    var rootX = [0.7,0.25,-0.2,-0.65], off = [-0.7,-0.25,0.28,0.72];
    for(var side=-1; side<=1; side+=2){
      for(var i=0;i<4;i++){
        var w = Math.sin(ph + i*1.6 + (side>0?Math.PI:0)) * wig;
        var a = side*(Math.PI/2 + off[i]) + w*side;
        var rx = rootX[i]*z, kx = rx + Math.cos(a)*z*1.5, ky = Math.sin(a)*z*1.5;
        var a2 = a - side*0.9;
        ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(kx, ky);
        ctx.lineTo(kx + Math.cos(a2)*z*1.5, ky + Math.sin(a2)*z*1.5); ctx.stroke();
      }
    }
    /* corpo */
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#0b0b12';
    ctx.beginPath(); ctx.ellipse(-z*0.75, 0, z*1.05, z*0.8, 0, 0, 6.2832); ctx.fill();   /* abdômen */
    ctx.beginPath(); ctx.ellipse(z*0.55, 0, z*0.62, z*0.5, 0, 0, 6.2832); ctx.fill();    /* cabeça */
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ff1f3d';                                                           /* marca vermelha */
    ctx.beginPath(); ctx.ellipse(-z*0.75, 0, z*0.38, z*0.24, 0, 0, 6.2832); ctx.fill();
    ctx.fillStyle = '#fff';                                                              /* olhinhos */
    ctx.beginPath(); ctx.arc(z*0.95, -z*0.16, z*0.11, 0, 6.2832); ctx.arc(z*0.95, z*0.16, z*0.11, 0, 6.2832); ctx.fill();
    ctx.restore();
  }

  function loop(now){
    var dt = Math.min(0.05, (now - last)/1000); last = now;
    ctx.clearRect(0, 0, W, H);
    for(var i=effects.length-1;i>=0;i--){
      var e = effects[i]; e.age += dt;
      if(e.age >= e.life){ effects.splice(i,1); continue; }
      drawWeb(e);
      e.spiders.forEach(function(s){ drawSpider(e, s); });
    }
    if(effects.length) requestAnimationFrame(loop); else { running = false; ctx.clearRect(0,0,W,H); }
  }

  window.addEventListener('pointerdown', function(ev){ burst(ev.clientX, ev.clientY); }, true);
})();
</script>
</body>
</html>
